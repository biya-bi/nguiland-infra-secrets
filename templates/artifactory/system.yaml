configVersion: 1
shared:
  database:
    allowNonPostgresql: false
    type: postgresql
    driver: org.postgresql.Driver
    url: jdbc:postgresql://<hostName>:<port>/<databaseName>
    username: <userName>
    password: <password>
artifactory:
  tomcat:
    connector:
      extraConfig: 'connectionTimeout="600000"'
